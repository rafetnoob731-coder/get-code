<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Inter', sans-serif; background:#0a0a0f; color:#e0e0e0; padding:20px; }
    .container { max-width:900px; margin:0 auto; }
    h1 { font-size:28px; color:#fff; margin-bottom:24px; }
    .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:24px; }
    .stat { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:12px; padding:16px; }
    .stat-label { font-size:12px; color:rgba(255,255,255,0.4); text-transform:uppercase; letter-spacing:0.05em; }
    .stat-value { font-size:24px; font-weight:700; color:#00d4ff; margin-top:4px; }
    .section { margin-bottom:20px; }
    .section h2 { font-size:18px; color:#fff; margin-bottom:12px; }
    table { width:100%; border-collapse:collapse; background:rgba(255,255,255,0.02); border-radius:12px; overflow:hidden; }
    th, td { padding:10px 14px; text-align:left; font-size:13px; border-bottom:1px solid rgba(255,255,255,0.04); }
    th { background:rgba(255,255,255,0.04); color:rgba(255,255,255,0.5); font-weight:500; text-transform:uppercase; font-size:11px; letter-spacing:0.05em; }
    .badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:500; }
    .badge-active { background:rgba(0,255,136,0.1); color:#00ff88; }
    .badge-used { background:rgba(0,212,255,0.1); color:#00d4ff; }
    .badge-expired { background:rgba(255,107,107,0.1); color:#ff6b6b; }
    .badge-pending { background:rgba(255,193,7,0.1); color:#ffc107; }
    .badge-completed { background:rgba(0,255,136,0.1); color:#00ff88; }
    .error { color:#ff6b6b; text-align:center; padding:40px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Admin Dashboard</h1>
    <div id="content"></div>
  </div>
  <script>
    const key = new URLSearchParams(location.search).get('key');
    if (!key) {
      document.getElementById('content').innerHTML = '<div class="error">Access denied. Provide ?key=</div>';
    } else {
      Promise.all([
        fetch(`/admin?key=${key}&action=dashboard`).then(r=>r.json()),
        fetch(`/admin?key=${key}&action=logs`).then(r=>r.json())
      ]).then(([dashboard, logs]) => {
        if (!dashboard.success) { document.getElementById('content').innerHTML = '<div class="error">'+dashboard.error+'</div>'; return; }
        const d = dashboard.data;
        let html = '<div class="stats">';
        html += '<div class="stat"><div class="stat-label">Users</div><div class="stat-value">'+d.users+'</div></div>';
        html += '<div class="stat"><div class="stat-label">Sessions</div><div class="stat-value">'+d.sessions+'</div></div>';
        html += '<div class="stat"><div class="stat-label">Active Codes</div><div class="stat-value">'+d.codes.active+'</div></div>';
        html += '<div class="stat"><div class="stat-label">Used Codes</div><div class="stat-value">'+d.codes.used+'</div></div>';
        html += '<div class="stat"><div class="stat-label">Expired</div><div class="stat-value">'+d.codes.expired+'</div></div>';
        html += '<div class="stat"><div class="stat-label">Total Codes</div><div class="stat-value">'+d.codes.total+'</div></div>';
        html += '</div>';
        if (logs.success && logs.data.length) {
          html += '<div class="section"><h2>Recent Logs</h2><table><tr><th>Action</th><th>Code</th><th>Status</th><th>Time</th></tr>';
          logs.data.slice(0,20).forEach(l => {
            html += '<tr><td>'+l.action+'</td><td>'+(l.verification_code||'-')+'</td><td><span class="badge badge-'+l.status+'">'+l.status+'</span></td><td>'+new Date(l.created_at).toLocaleString()+'</td></tr>';
          });
          html += '</table></div>';
        }
        html += '<div class="section"><h2>All Codes</h2><table><tr><th>Code</th><th>Session</th><th>Status</th><th>Reward</th><th>Created</th></tr>';
        document.getElementById('content').innerHTML = html;
        fetch(`/admin?key=${key}&action=codes`).then(r=>r.json()).then(cd => {
          if (cd.success) {
            let tbl = '';
            cd.data.forEach(c => {
              tbl += '<tr><td>'+c.verification_code+'</td><td style="font-size:11px">'+c.session_id.substring(0,16)+'...</td><td><span class="badge badge-'+c.status+'">'+c.status+'</span></td><td>'+c.reward+'</td><td style="font-size:11px">'+new Date(c.created_at).toLocaleString()+'</td></tr>';
            });
            document.querySelector('.section:last-child table')?.insertAdjacentHTML('afterbegin','<tbody>'+tbl+'</tbody>');
          }
        });
      }).catch(e => { document.getElementById('content').innerHTML = '<div class="error">Error: '+e.message+'</div>'; });
    }
  </script>
</body>
</html>
